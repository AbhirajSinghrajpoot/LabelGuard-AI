<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabelGuard AI | Legal Metrology PCR 2011 Compliance Engine</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "paper": "#FEF9F1",
              "paper-muted": "#F4F1EA",
              "ink": "#14130F",
              "ink-muted": "#4A473F",
              "border-hairline": "#DED9D2",
              "stamp-green": "#1F7A5A",
              "stamp-red": "#D6372A",
              "stamp-amber": "#C98A12",
              "stamp-grey": "#7A776E",
              "surface-dim": "#DED9D2",
              "primary": "#B2230B",
              "secondary": "#036C4D"
            },
            fontFamily: {
              "serif-display": ["'Instrument Serif'", "'EB Garamond'", "serif"],
              "body-sans": ["'IBM Plex Sans'", "sans-serif"],
              "mono-tech": ["'IBM Plex Mono'", "'Space Mono'", "monospace"],
              "handwriting": ["'Caveat'", "cursive"]
            }
          }
        }
      };
    </script>
    <style>
      .font-serif-display { font-family: 'Instrument Serif', 'EB Garamond', serif; }
      .font-mono-tech { font-family: 'IBM Plex Mono', 'Space Mono', monospace; }
      .font-handwriting { font-family: 'Caveat', cursive; }
      .stamp-border { box-shadow: inset 0 0 0 2px currentColor, inset 0 0 0 5px #FEF9F1, inset 0 0 0 7px currentColor; }
      .stamp-border-sm { box-shadow: inset 0 0 0 1.5px currentColor, inset 0 0 0 3px #FEF9F1, inset 0 0 0 4.5px currentColor; }
      .perforated-rule {
        background-image: radial-gradient(circle, #14130F 1.2px, transparent 1.2px);
        background-size: 12px 12px;
        background-repeat: repeat-x;
        height: 3px;
        opacity: 0.35;
      }
      .perforated-edge {
        background: linear-gradient(135deg, transparent 6px, #fff 6px, transparent 0), linear-gradient(225deg, transparent 6px, #fff 6px, transparent 0);
        background-size: 14px 14px;
        background-repeat: repeat-x;
        height: 12px;
      }
    </style>
  </head>
  <body class="bg-paper font-body-sans text-ink antialiased selection:bg-amber-100 selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
